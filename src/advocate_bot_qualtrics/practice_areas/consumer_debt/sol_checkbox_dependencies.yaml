# November 15 SOL choices: nested reasons require an explicit main-defense inclusion.
version: '2'
personalization_only:
- guided_plaintiff
- guided_original_creditor
facts:
  plaintiff_type:
    fields:
    - guided_creditor_type
    questions:
    - sol_creditor_type_resolve
  payment_timing:
    fields:
    - guided_payment_date
    - guided_filing_date
    questions:
    - sol_payment_estimate_agree
    - sol_payment_age
    review_evidence:
    - answer: sol_payment_age
      values:
      - 'yes'
      - 'no'
      - unknown
      fields:
      - guided_filing_date
      questions:
      - sol_payment_age
    - answer: sol_payment_estimate_agree
      values:
      - 'yes'
      fields:
      - guided_payment_date
      - guided_filing_date
      questions:
      - sol_payment_estimate_agree
    - answer: sol_payment_estimate_agree
      values:
      - reuse_comparison
      fields:
      - guided_payment_date
      - guided_filing_date
      questions: []
  oral_agreement:
    fields:
    - guided_oral
    questions:
    - sol_oral_gate_resolve
  main_selection:
    fields: []
    questions:
    - statute_of_limitations_decision
rules:
  eligible_path:
    any:
    - fact: plaintiff_type
      equals: buyer
    - all:
      - fact: plaintiff_type
        equals: original
      - fact: payment_timing
        one_of:
        - qualifying
        - recent
        - uncertain
  oral_path:
    all:
    - rule: nested_path
    - fact: oral_agreement
      one_of:
      - 'yes'
      - 'no'
  nested_path:
    all:
    - rule: eligible_path
    - fact: main_selection
      equals: 'yes'
checkboxes:
  main:
    rule: eligible_path
    question: statute_of_limitations_decision
  first:
    rule: nested_path
    question: sol_checkboxes_first_third
  third:
    rule: nested_path
    question: sol_checkboxes_first_third
  second:
    rule: oral_path
    question: sol_checkbox_second
    alternate_questions:
    - sol_written
