    the same for either plaintiff type:'
  source_index: 468
- text: 'Ask:'
  source_index: 469
  screen_footnotes:
  - '45'
- text: Did [PLAINTIFF] give you false information or leave out important information about this account,
    such as fees?
  source_index: 470
- text: 'If Yes, show the response for the plaintiff type:'
  source_index: 471
  screen_footnotes:
  - '46'
- text: 'Debt buyer:'
  source_index: 472
- text: This defense may apply if you think [PLAINTIFF] or [ORIGINAL.CREDITOR] hid important facts about
    your account from you.
  source_index: 473
- text: You said [PLAINTIFF] may have hidden important facts about your account from you.
  source_index: 474
- text: Many people in this situation check this box to keep open this defense for later use.
  source_index: 475
- text: 'Original creditor:'
  source_index: 476
- text: This defense may apply if you think [PLAINTIFF] hid important facts about your account from you.
  source_index: 477
- text: You said [PLAINTIFF] may have hidden important facts about your account from you.
  source_index: 478
- text: Many people in this situation check this box to keep open this defense for later use.
  source_index: 479
- text: Record the user’s checkbox choice. Record that the user reported fraud for reuse in Common Counts
    Only.
  source_index: 480
- text: 'If No:'
  source_index: 481
  screen_footnotes:
  - '47'
- text: This defense does not apply since you did not report false or missing information about this account.
  source_index: 482
- text: Finish this defense.
  source_index: 483
