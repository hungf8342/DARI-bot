- text: Debt buyers often sue on older accounts or may not have records of a last payment you made to
    the original creditor.
  source_index: 100
  source: docs/source-material/2026-11-15/2026.11.15 Affirmative-Defense-Scripts-v3.docx
- text: You are being sued by a debt buyer.
  source_index: 101
  source: docs/source-material/2026-11-15/2026.11.15 Affirmative-Defense-Scripts-v3.docx
