- text: 9 Fraud, Misrepresentation and Concealment
  source_index: 457
- text: General explanation show to everyone
  source_index: 458
  screen_footnotes:
  - '43'
- text: Fraud, misrepresentation, and concealment involve being misled about important facts related to
    the terms of the contract.
  source_index: 459
- text: For example, the credit card company may have misled you about interest rates, fees, or penalties.
    You may have then agreed to the account or made payments based on that false information.
  source_index: 460
- text: Another example is if someone else opened the account by stealing your identity.
  source_index: 461
- text: Use the identity theft answer already collected
  source_index: 462
- text: 'If the user reported suspected identity theft:'
  source_index: 463
  screen_footnotes:
  - '44'
- text: You said earlier that you suspect identity theft—someone else opened this account under your name
    without your permission. This defense may apply since you suspect identity theft.
  source_index: 464
- text: Many litigants who check off identity theft also check off this defense.
  source_index: 465
- text: Record the user’s checkbox choice. Continue to Confirm selections.
  source_index: 466
- text: Ask about false or missing information
  source_index: 467
