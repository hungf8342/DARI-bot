- text: 14 Lack of Consideration
  source_index: 667
- text: General explanation show to everyone
  source_index: 668
  screen_footnotes:
  - '84'
- text: Consideration is when you receive something of value as part of a  contract. For a credit card
    account, the “bargain” between the company and the consumer is that the consumer can use the credit
    card to buy things  in exchange for paying the credit card company back on a regular basis. . Lack
    of consideration means you didn’t get any benefit from the creditor card because you did not actually
    use or receive the things purchased. The questions below ask about identity theft and whether you
    or someone you opened the account for actually used the account.
