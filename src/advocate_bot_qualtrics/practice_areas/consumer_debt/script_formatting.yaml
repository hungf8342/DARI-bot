- text: Statute of limitations is a rule that says if [PLAINTIFF] waits too long, they cannot sue you.
    The maximum length of time they can wait varies depending on which state’s law applies. Statute of
    limitations is a strong defense if it applies.
  source_index: 96
  source: docs/source-material/2026-11-15/2026.11.15 Affirmative-Defense-Scripts-v3.docx
- text: Consider raising this defense in an answer if [PLAINTIFF] filed their complaint one year or more
    after your last payment.
  source_index: 97
  source: docs/source-material/2026-11-15/2026.11.15 Affirmative-Defense-Scripts-v3.docx
- text: If the plaintiff is a debt buyer, use the Debt buyer path. If the plaintiff is the original creditor,
    use Original creditor timing. If the plaintiff type is unresolved, continue to “Clarify an unresolved
    answer.”
  source_index: 98
  source: docs/source-material/2026-11-15/2026.11.15 Affirmative-Defense-Scripts-v3.docx
- text: Debt buyer path (plaintiff type = debt buyer)
  source_index: 99
